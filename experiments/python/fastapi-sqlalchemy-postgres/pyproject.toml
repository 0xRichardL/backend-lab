[project]
name = "fastapi-sqlalchemy-postgres"
version = "0.1.0"
description = "A small FastAPI todo API for learning the request-to-Postgres path"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.159.1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
